name: promptfoo redteam CI
on:
  workflow_dispatch:
jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g promptfoo
      - run: promptfoo --version
      - name: config smoke (no key, dry validation)
        run: promptfoo eval -c promptfooconfig_full.yaml --dry-run || true
      - name: redteam eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: promptfoo eval -c promptfooconfig_full.yaml -o results.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.json
